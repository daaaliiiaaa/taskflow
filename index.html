<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taskflow - Task Tracker</title>
<link rel="icon" type="image/png" href="images/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="logo">
<img class="logo-img" src="images/logo.png" alt="Taskflow" width="283" height="44">
</div>
<p id="today"></p>
</header>

<hr>

<section class="add-task">
<h2>Add Task</h2>
<form id="taskForm">
<label for="title">Task Name:</label>
<input type="text" id="title" maxlength="60" required>

<label for="description">Description:</label>
<textarea id="description" rows="3" maxlength="200"></textarea>

<label for="startDate">Start Date:</label>
<input type="date" id="startDate" required>

<label for="endDate">End Date:</label>
<input type="date" id="endDate" required>

<label for="priority">Priority:</label>
<select id="priority">
<option value="low">Low</option>
<option value="medium" selected>Medium</option>
<option value="high">High</option>
</select>

<label for="status">Status:</label>
<select id="status">
<option value="to-do">To Do</option>
<option value="doing">Doing</option>
<option value="done">Done</option>
</select>

<p id="formError"></p>

<button type="submit">Add Task</button>
</form>
</section>

<hr>

<main>
<h2>All Tasks</h2>
<p id="summary"></p>

<div class="toolbar">
<label for="search">Search:</label>
<input type="search" id="search" placeholder="Search by name or description">

<label for="filterPriority">Priority:</label>
<select id="filterPriority">
<option value="all">All</option>
<option value="high">High</option>
<option value="medium">Medium</option>
<option value="low">Low</option>
</select>

<button type="button" id="clearDone">Clear Done</button>
</div>

<div class="columns">

<section class="column">
<h3>To Do <span class="count" id="count-to-do">0</span></h3>
<ul id="to-do"></ul>
</section>

<section class="column">
<h3>Doing <span class="count" id="count-doing">0</span></h3>
<ul id="doing"></ul>
</section>

<section class="column">
<h3>Done <span class="count" id="count-done">0</span></h3>
<ul id="done"></ul>
</section>

<section class="column">
<h3>Outdated <span class="count" id="count-out-dated">0</span></h3>
<ul id="out-dated"></ul>
</section>

</div>
</main>

<hr>

<footer>
<p class="team-title">Built by</p>
<ul class="team">
<li>Deema Hammouri</li>
<li>Dalia Obidat</li>
<li>Feras</li>
</ul>
</footer>

</body>
</html>
